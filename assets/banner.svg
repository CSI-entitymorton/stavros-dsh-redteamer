<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="stavros-dsh-redteamer — authorized red-team harness for the DeepSeek Harness (DSH)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#131823"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.1" r="0.65">
      <stop offset="0" stop-color="#f85149" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f85149" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1b2330" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- terminal window (left) -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace">
    <rect x="40" y="64" width="430" height="232" rx="10" fill="#0a0d13" stroke="#2a3441" stroke-width="1.5"/>
    <rect x="40" y="64" width="430" height="34" rx="10" fill="#151b26"/>
    <rect x="40" y="84" width="430" height="14" fill="#151b26"/>
    <circle cx="62" cy="81" r="5.5" fill="#ff5f56"/>
    <circle cx="82" cy="81" r="5.5" fill="#ffbd2e"/>
    <circle cx="102" cy="81" r="5.5" fill="#27c93f"/>
    <text x="118" y="86" fill="#5b6577" font-size="13">stavros@harness: ~/engagement</text>

    <text x="58" y="128" fill="#8b949e" font-size="15">$ <tspan fill="#f85149">node</tspan> tools/scope-guard.js check target.com</text>
    <text x="58" y="156" fill="#3fb950">[ OK ] in scope · tier auto · proceeding</text>
    <text x="58" y="188" fill="#8b949e" font-size="15">$ <tspan fill="#f85149">dsh</tspan> spawn stavros-sqli — "auth bypass on /api"</text>
    <text x="58" y="216" fill="#d29922">[ ! ] target behind WAF · throttling to 2 req/s</text>
    <text x="58" y="248" fill="#8b949e" font-size="15">$ <tspan fill="#f85149">node</tspan> tools/record-finding.js '{...}'</text>
    <text x="58" y="276" fill="#3fb950">[ OK ] finding #12 verified · cvss 7.5 · synced</text>
  </g>

  <!-- title block (right) -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace">
    <rect x="520" y="78" width="6" height="126" fill="#f85149"/>
    <text x="548" y="152" fill="#e6edf3" font-size="66" font-weight="bold" letter-spacing="2">STAVROS</text>
    <text x="552" y="184" fill="#f85149" font-size="20" letter-spacing="6">DSH · REDTEAMER</text>
    <text x="548" y="220" fill="#9da7b3" font-size="17">Expert team · human-supervised · fail-closed by code</text>
    <text x="548" y="252" fill="#6e7681" font-size="15" font-style="italic">"No authorization decision left for you to make — let the gate decide."</text>

    <text x="548" y="300" fill="#e6edf3" font-size="17"><tspan fill="#f85149" font-weight="bold">24</tspan> specialists  ·  <tspan fill="#f85149" font-weight="bold">78</tspan> guarded tools  ·  <tspan fill="#f85149" font-weight="bold">0</tspan> runtime deps</text>
  </g>
</svg>
