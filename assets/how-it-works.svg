<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-label="How Stavros works: you ask the orchestrator, which reads the methodology and scope, spawns 24 specialists, and invokes guarded tools. Every action passes the scope-guard: in scope it executes and produces verified findings; out of scope or with an empty scope it is blocked, fail-closed.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#131823"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.06" r="0.7">
      <stop offset="0" stop-color="#f85149" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f85149" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1b2330" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="6" y="6" width="888" height="748" rx="16" fill="url(#bg)" stroke="#2a3441" stroke-width="1.5"/>
  <rect x="6" y="6" width="888" height="748" rx="16" fill="url(#grid)"/>
  <rect x="6" y="6" width="888" height="748" rx="16" fill="url(#glow)"/>

  <g font-family="'DejaVu Sans Mono','Courier New',monospace">
    <!-- header chrome -->
    <circle cx="34" cy="36" r="6" fill="#ff5f56"/>
    <circle cx="56" cy="36" r="6" fill="#ffbd2e"/>
    <circle cx="78" cy="36" r="6" fill="#27c93f"/>
    <text x="104" y="41" fill="#5b6577" font-size="14">stavros — one prompt, every action scope-gated</text>
    <line x1="24" y1="58" x2="870" y2="58" stroke="#1b2330" stroke-width="1"/>

    <!-- ===== vertical spine: 5 phases ===== -->
    <rect x="70" y="78" width="310" height="66" rx="10" fill="#10161f" stroke="#2a3441" stroke-width="1.5"/>
    <circle cx="100" cy="111" r="14" fill="#f85149"/><text x="100" y="116" fill="#0b0e14" font-size="15" font-weight="bold" text-anchor="middle">1</text>
    <text x="126" y="106" fill="#e6edf3" font-size="16.5" font-weight="bold">You</text>
    <text x="126" y="128" fill="#8b949e" font-size="12.5">"assess https://target.com"</text>

    <rect x="70" y="180" width="310" height="66" rx="10" fill="#10161f" stroke="#f85149" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="100" cy="213" r="14" fill="#f85149"/><text x="100" y="218" fill="#0b0e14" font-size="15" font-weight="bold" text-anchor="middle">2</text>
    <text x="126" y="208" fill="#e6edf3" font-size="16.5" font-weight="bold">Stavros orchestrator</text>
    <text x="126" y="230" fill="#8b949e" font-size="12.5">persona · cordis.patch.yml</text>

    <rect x="70" y="282" width="310" height="66" rx="10" fill="#10161f" stroke="#2a3441" stroke-width="1.5"/>
    <circle cx="100" cy="315" r="14" fill="#f85149"/><text x="100" y="320" fill="#0b0e14" font-size="15" font-weight="bold" text-anchor="middle">3</text>
    <text x="126" y="310" fill="#e6edf3" font-size="16.5" font-weight="bold">Reads methodology + scope</text>
    <text x="126" y="332" fill="#8b949e" font-size="12.5">knowledge.md · scope.json</text>

    <rect x="70" y="384" width="310" height="66" rx="10" fill="#10161f" stroke="#2a3441" stroke-width="1.5"/>
    <circle cx="100" cy="417" r="14" fill="#f85149"/><text x="100" y="422" fill="#0b0e14" font-size="15" font-weight="bold" text-anchor="middle">4</text>
    <text x="126" y="412" fill="#e6edf3" font-size="16.5" font-weight="bold">Spawns 24 specialists</text>
    <text x="126" y="434" fill="#8b949e" font-size="12.5">subagents/*.md</text>

    <rect x="70" y="486" width="310" height="66" rx="10" fill="#10161f" stroke="#2a3441" stroke-width="1.5"/>
    <circle cx="100" cy="519" r="14" fill="#f85149"/><text x="100" y="524" fill="#0b0e14" font-size="15" font-weight="bold" text-anchor="middle">5</text>
    <text x="126" y="514" fill="#e6edf3" font-size="16.5" font-weight="bold">Invokes guarded tools</text>
    <text x="126" y="536" fill="#8b949e" font-size="12.5">tools/*.js · guarded engines</text>

    <!-- spine connectors (line + drawn triangle) -->
    <g stroke="#5b6577" stroke-width="2" fill="#5b6577">
      <line x1="225" y1="146" x2="225" y2="171"/><polygon points="220,171 230,171 225,180" stroke="none"/>
      <line x1="225" y1="248" x2="225" y2="273"/><polygon points="220,273 230,273 225,282" stroke="none"/>
      <line x1="225" y1="350" x2="225" y2="375"/><polygon points="220,375 230,375 225,384" stroke="none"/>
      <line x1="225" y1="452" x2="225" y2="477"/><polygon points="220,477 230,477 225,486" stroke="none"/>
      <line x1="225" y1="554" x2="225" y2="565"/><polygon points="220,565 230,565 225,572" stroke="none"/>
    </g>

    <!-- scope-guard gate -->
    <path d="M225,572 L267,612 L225,652 L183,612 Z" fill="#10161f" stroke="#d29922" stroke-width="2"/>
    <text x="225" y="608" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">SCOPE</text>
    <text x="225" y="623" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">GUARD</text>

    <!-- allow branch -->
    <text x="352" y="600" fill="#3fb950" font-size="12.5" text-anchor="middle" font-style="italic">in scope</text>
    <g stroke="#3fb950" stroke-width="2" fill="#3fb950">
      <line x1="269" y1="612" x2="421" y2="612"/><polygon points="421,607 421,617 430,612" stroke="none"/>
      <line x1="606" y1="612" x2="651" y2="612"/><polygon points="651,607 651,617 660,612" stroke="none"/>
    </g>
    <rect x="430" y="584" width="176" height="56" rx="9" fill="#10161f" stroke="#3fb950" stroke-width="1.5"/>
    <text x="518" y="617" fill="#e6edf3" font-size="15" text-anchor="middle">Action executes</text>
    <rect x="660" y="584" width="225" height="56" rx="9" fill="#0e1a12" stroke="#3fb950" stroke-width="1.5"/>
    <text x="772" y="609" fill="#3fb950" font-size="14.5" font-weight="bold" text-anchor="middle">Verified findings</text>
    <text x="772" y="628" fill="#8b949e" font-size="11.5" text-anchor="middle">reports/findings.jsonl</text>

    <!-- deny branch -->
    <text x="252" y="690" fill="#f85149" font-size="12" text-anchor="start">out of scope · empty</text>
    <g stroke="#f85149" stroke-width="2" fill="#f85149">
      <polyline points="225,654 225,700 421,700" fill="none"/><polygon points="421,695 421,705 430,700" stroke="none"/>
    </g>
    <rect x="430" y="676" width="300" height="50" rx="9" fill="#1a1113" stroke="#f85149" stroke-width="1.5"/>
    <text x="580" y="699" fill="#f85149" font-size="15" font-weight="bold" text-anchor="middle">BLOCKED — fail-closed</text>
    <text x="580" y="717" fill="#8b949e" font-size="11" text-anchor="middle">the request never leaves the box</text>

    <!-- footer -->
    <line x1="24" y1="732" x2="870" y2="732" stroke="#1b2330" stroke-width="1"/>
    <text x="450" y="748" fill="#3a424f" font-size="11.5" text-anchor="middle">merge-only hydration · empty scope seeded fail-closed · tamper-evident findings</text>
  </g>
</svg>
