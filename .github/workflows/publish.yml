name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also publish to npm (tag push does this automatically)'
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fail-closed smoke test (no scope.json must block)
        run: |
          if node tools/scope-guard.js check https://example.com; then
            echo "FAIL: scope-guard did NOT fail closed without scope.json" >&2
            exit 1
          fi
          echo "fail-closed OK (no scope.json)"
      - name: Fail-closed smoke test (empty scope.json must block)
        run: |
          echo '{"allowed_hosts":[],"allowed_ips":[]}' > scope.json
          if node tools/scope-guard.js check https://example.com; then
            echo "FAIL: scope-guard did NOT fail closed with empty scope.json" >&2
            exit 1
          fi
          echo "fail-closed OK (empty scope.json)"

  pack:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "tag $TAG does not match package version $VER" >&2
            exit 1
          fi
      - name: Build
        run: npm run build
      - name: Pack (no credentials)
        run: mkdir -p dist && npm pack --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: 'dist/*.tgz'

  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        run: npm publish ./dist/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: 'dist/*.tgz'
          generate_release_notes: true
